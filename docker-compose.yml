services:
  videra:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VIDERA_TRANSPORT: http
      VIDERA_HTTP_ADDR: :8080
      VIDERA_DATA_DIR: /data
      VIDERA_RUNTIME_MODE: local
      VIDERA_FRAME_INTERVAL_SEC: 5
      VIDERA_DEFAULT_SEARCH_LIMIT: 5
      VIDERA_INDEX_CONCURRENCY: 4
      VIDERA_SEARCH_AUDIO_WEIGHT: 1.0
      VIDERA_SEARCH_VISUAL_WEIGHT: 1.0
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ${VIDERA_VIDEO_DIR:-.}:/videos:ro
