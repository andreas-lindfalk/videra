services:
  videra:
    platform: ${VIDERA_DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${VIDERA_DOCKER_TARGET:-runtime-lancedb-native}
      args:
        LANCEDB_NATIVE_VERSION: ${LANCEDB_NATIVE_VERSION:-v0.1.2}
    environment:
      VIDERA_TRANSPORT: http
      VIDERA_HTTP_ADDR: :8080
      VIDERA_DATA_DIR: /data
      VIDERA_STORAGE_BACKEND: ${VIDERA_STORAGE_BACKEND:-lancedb}
      VIDERA_RUNTIME_MODE: local
      VIDERA_INGESTION_MODE: simulated
      VIDERA_WHISPER_MODEL: tiny
      VIDERA_WHISPER_LANGUAGE: ""
      VIDERA_FRAME_INTERVAL_SEC: 5
      VIDERA_DEFAULT_SEARCH_LIMIT: 5
      VIDERA_INDEX_CONCURRENCY: 4
      VIDERA_SEARCH_AUDIO_WEIGHT: 1.0
      VIDERA_SEARCH_VISUAL_WEIGHT: 1.0
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ${VIDERA_VIDEO_DIR:-./videos}:/videos:ro
